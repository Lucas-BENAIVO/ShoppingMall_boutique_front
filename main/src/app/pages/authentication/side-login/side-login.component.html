<div class="auth-container">
  <!-- Left Panel - Testimonial -->
  <div class="auth-right" style="background-image: url('/assets/images/backgrounds/free.jpg'); background-size: cover; background-position: center 70%; background-repeat: no-repeat; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;">
    <div class="testimonial-content">
      <div class="testimonial-stars">★★★★★</div>
      
      <p class="testimonial-quote">
        "Nous adorons utiliser cette plateforme ! L'expérience d'achat est simple et agréable."
      </p>
      
      <div class="testimonial-author">Marie Dubois</div>
      <div class="testimonial-position">Fondatrice, StyleHub, Agence de Mode en ligne</div>
    </div>
  </div>

  <!-- Right Panel - Form -->
  <div class="auth-left">
    <div class="auth-title">Bienvenue</div>
    <div class="auth-subtitle">Bienvenue ! Veuillez entrer vos informations.</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div *ngIf="errorMessage" class="error-message" style="color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 8px; margin-bottom: 16px; text-align: center;">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="Entrez votre email" formControlName="uname" />
      </div>

      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" class="form-input" placeholder="••••••••" formControlName="password" />
      </div>

      <div class="form-options">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="remember" />
          <label for="remember">Se souvenir pendant 30 jours</label>
        </div>
      </div>

      <button type="submit" class="btn-signin" [disabled]="form.invalid || isLoading">
        {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>


      <div class="signup-link">
        Vous n'avez pas de compte ?<a [routerLink]="['/authentication/register']">Inscrivez-vous gratuitement</a>
      </div>
    </form>
  </div>
</div>
